name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: linux-x86_64
            archive: tar.gz
            bin_name: jotto
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset_name: linux-aarch64
            archive: tar.gz
            bin_name: jotto
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: macos-aarch64
            archive: tar.gz
            bin_name: jotto
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: macos-x86_64
            archive: tar.gz
            bin_name: jotto
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: windows-x86_64
            archive: zip
            bin_name: jotto.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set Cargo package version from release tag
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          import os
          import pathlib
          import re

          tag = os.environ.get("RELEASE_TAG", "").strip().lstrip("v")
          if re.match(r"^\d+\.\d+\.\d+", tag):
              p = pathlib.Path("Cargo.toml")
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'(?m)^version\s*=\s*"[^"]+"',
                  f'version = "{tag}"',
                  text,
                  count=1,
              )
              p.write_text(text, encoding="utf-8")
              print(f"Updated Cargo.toml version to {tag}")
          else:
              print(f"Keeping existing Cargo.toml version (ref: {tag})")

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries (pulls fresh SCOWL word list)
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/jotto" "dist/jotto-${{ matrix.asset_name }}"
          cp "target/${{ matrix.target }}/release/wordle" "dist/wordle-${{ matrix.asset_name }}"
          chmod +x "dist/jotto-${{ matrix.asset_name }}" "dist/wordle-${{ matrix.asset_name }}"
          staging="jotto-${{ matrix.asset_name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/jotto" "target/${{ matrix.target }}/release/wordle" "$staging/"
          cp README.md LICENSE LICENSE.SCOWL "$staging/"
          tar -czf "dist/jotto-${{ matrix.asset_name }}.tar.gz" "$staging"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jotto.exe" "dist/jotto-${{ matrix.asset_name }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/wordle.exe" "dist/wordle-${{ matrix.asset_name }}.exe"
          $staging = "jotto-${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jotto.exe", "target/${{ matrix.target }}/release/wordle.exe" "$staging/"
          Copy-Item README.md, LICENSE, LICENSE.SCOWL "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/jotto-${{ matrix.asset_name }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.asset_name }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
