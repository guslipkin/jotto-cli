name: Docker

# The browser arcade image (see Dockerfile), on the same rules as the binaries'
# release workflow: a published GitHub Release builds and pushes it to GHCR,
# tagged with the release's version; running the workflow by hand only builds
# it, as a check.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: jotto-arcade

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Each architecture builds on its own kind of runner, as the binaries do,
    # rather than under emulation, which is many times slower for Rust.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Cargo package version from release tag
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          import os
          import pathlib
          import re

          tag = os.environ.get("RELEASE_TAG", "").strip().lstrip("v")
          if re.match(r"^\d+\.\d+\.\d+", tag):
              p = pathlib.Path("Cargo.toml")
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'(?m)^version\s*=\s*"[^"]+"',
                  f'version = "{tag}"',
                  text,
                  count=1,
              )
              p.write_text(text, encoding="utf-8")
              print(f"Updated Cargo.toml version to {tag}")
          else:
              print(f"Keeping existing Cargo.toml version (ref: {tag})")

      - name: Image name and platform slug
        shell: bash
        run: |
          # GHCR names must be lower case.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the publish job then tags the platforms together.
      - name: Build image (pulls fresh SCOWL word list)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'release' }}

      - name: Export digest
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release's version (1.2.3 and 1.2) and latest, as the binaries'
      # release names its version; a pre-release doesn't move latest.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Tag and push the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          # Every tag from the metadata step, and every platform's digest.
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
