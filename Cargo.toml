[package]
name = "jotto"
version = "0.1.0"
edition = "2021"
authors = ["Gus Lipkin"]
description = "CLI versions of the classic Jotto and Wordle word games, and the Contexto meaning game and the Flights airport-code game, written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guslipkin/jotto-cli"
build = "build.rs"
default-run = "jotto"

[[bin]]
name = "jotto"
path = "src/main.rs"

[[bin]]
name = "wordle"
path = "src/bin/wordle.rs"

[[bin]]
name = "contexto"
path = "src/bin/contexto.rs"

[[bin]]
name = "flights"
path = "src/bin/flights.rs"

# All four games in one program, chosen from a menu (and what the Docker image runs).
[[bin]]
name = "arcade"
path = "src/bin/arcade.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fastrand = "2.3"
# Paragraph::line_count, for scrolling a wrapped paragraph to its end.
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Inflates the Flights data, which build.rs deflates into the binary.
miniz_oxide = "0.9"

[build-dependencies]
miniz_oxide = "0.9"


# The binaries are mostly embedded data; these trim the code around it. Unwinding
# stays on, since `arcade` catches a game's panic and returns to its menu.
[profile.release]
lto = true
codegen-units = 1
strip = true
