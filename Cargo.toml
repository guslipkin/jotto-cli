[package]
name = "jotto"
version = "0.1.0"
edition = "2021"
authors = ["Gus Lipkin"]
description = "CLI versions of the classic Jotto and Wordle word games, and the Contexto meaning game and the Flights airport-code game, written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guslipkin/jotto-cli"
build = "build.rs"
default-run = "jotto"

[[bin]]
name = "jotto"
path = "src/main.rs"

[[bin]]
name = "wordle"
path = "src/bin/wordle.rs"

[[bin]]
name = "contexto"
path = "src/bin/contexto.rs"

[[bin]]
name = "flights"
path = "src/bin/flights.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fastrand = "2.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

